stages: [lint, build, test, release]

default:
  image: debian:trixie

lint:
  stage: lint
  script:
    - apt-get update -qq && apt-get install -y -qq shellcheck python3
    - shellcheck tools/*.sh core/build.sh tests/*.sh
    - python3 -m py_compile core/config/includes.chroot/usr/local/lib/ark/ark-detect core/config/includes.chroot/usr/local/lib/ark/ark_roles.py core/config/includes.chroot/usr/local/bin/ark-wizard
    - python3 -m unittest discover -s tests -v

build-core:
  stage: build
  tags: [privileged]   # live-build needs chroot/mount; runner must be privileged
  script:
    - apt-get update -qq
    - apt-get install -y -qq live-build debootstrap squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin grub-common gdisk dosfstools e2fsprogs mtools curl ca-certificates fdisk
    - ./core/build.sh
  artifacts:
    expire_in: 1 week
    paths:
      - out/ark-core.iso
      - out/ark-core.img
      - out/SHA256SUMS
      - core/build.log

smoke-bios:
  stage: test
  tags: [kvm]
  needs: [build-core]
  script:
    - apt-get update -qq && apt-get install -y -qq qemu-system-x86 curl
    - tests/qemu-smoke.sh out/ark-core.iso bios

smoke-uefi:
  stage: test
  tags: [kvm]
  needs: [build-core]
  script:
    - apt-get update -qq && apt-get install -y -qq qemu-system-x86 ovmf curl
    - tests/qemu-smoke.sh out/ark-core.iso uefi

sign:
  stage: release
  needs: [build-core, smoke-bios, smoke-uefi]
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - apt-get update -qq && apt-get install -y -qq minisign
    - echo "$MINISIGN_KEY" > /tmp/ark.key        # masked, protected CI variable
    - minisign -S -s /tmp/ark.key -m out/SHA256SUMS
    - rm -f /tmp/ark.key
  artifacts:
    paths:
      - out/SHA256SUMS
      - out/SHA256SUMS.minisig
