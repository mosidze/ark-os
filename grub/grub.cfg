# ARK-Core GRUB menu. Lives on the ESP at /boot/grub/grub.cfg.
# Active system slot (A or B) is kept in /boot/grub/grubenv as ark_slot.

set default=0
set timeout=5
set timeout_style=menu

insmod part_gpt
insmod ext2
insmod fat
insmod all_video
insmod gfxterm
terminal_output gfxterm

load_env ark_slot
if [ -z "${ark_slot}" ]; then
    set ark_slot=A
fi

# Kernel and initrd are version-suffixed in the live/ directory; use wildcards.
function ark_boot {
    set slot="$1"
    shift
    search --no-floppy --label "ARK-SYS-${slot}" --set=root
    linux (${root})/live/vmlinuz* boot=live components live-media=/dev/disk/by-label/ARK-SYS-${slot} live-media-path=/live ark.slot=${slot} "$@"
    initrd (${root})/live/initrd.img*
}

menuentry "ARK-Core (slot ${ark_slot})" {
    ark_boot "${ark_slot}" quiet
}

menuentry "ARK-Core в RAM (toram): носитель можно вытащить" {
    ark_boot "${ark_slot}" quiet toram
}

menuentry "ARK-Core, безопасный режим (без GPU-драйверов)" {
    ark_boot "${ark_slot}" nomodeset noapic
}

menuentry "ARK-Core, режим клонирования (прожечь копию)" {
    ark_boot "${ark_slot}" quiet toram ark.mode=clone
}

if [ "${ark_slot}" = "A" ]; then
    menuentry "Резервный слот B" {
        ark_boot B quiet
    }
else
    menuentry "Резервный слот A" {
        ark_boot A quiet
    }
fi
